<!doctype html>
<html lang="zh-CN">
<head>
<!-- ARTIFACT-SHELL-START -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="时光拼图：80 后童年场景拖拽拼图，接对的块自动连成整块，30 关从 9 块递增到 120 块。">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A9%3C/text%3E%3C/svg%3E">
<style>
  /* 独立部署用的基础重置（Artifact 平台原本自动注入的那一层） */
  :root{
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<!-- ARTIFACT-SHELL-END -->
<title>时光拼图</title>
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#F7F8FA;
    --board:#ECEFF3;
    --line:#DEE2E9;
    --line-2:#C6CCD6;
    --ink:#111418;
    --ink-2:#414A57;
    --muted:#79828F;
    --accent:#C2410C;
    --accent-soft:#FCEDE5;
    --group:#15803D;
    --group-soft:#E8F3EC;
    --seam:rgba(17,20,24,.24);
    --shadow:0 2px 12px rgba(17,20,24,.10);
    --shadow-lift:0 10px 24px rgba(17,20,24,.26);
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  #app{
    height:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:12px 16px;
    max-width:520px;
    margin:0 auto;
  }
  /* 顶栏与底栏钉住，中间区域自己伸缩 */
  .brandbar{flex:0 0 auto;display:flex;align-items:center;gap:8px}
  .mid{
    flex:1;min-height:0;
    display:flex;flex-direction:column;justify-content:center;gap:14px;
  }
  .bot{flex:0 0 auto;display:flex;flex-direction:column;gap:9px}
  .logo{width:22px;height:22px;color:var(--ink);flex:0 0 auto;display:block}
  .brandname{font-size:14px;font-weight:700;letter-spacing:.06em}
  #btnLv{margin-left:auto;flex:0 0 auto;padding:7px 11px;font-size:12px}
  .hgroup{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
  .eyebrow{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.04em}
  h1{
    margin:0;font-size:40px;font-weight:700;
    letter-spacing:.08em;line-height:1.15;
  }

  /* ---- 页脚 ---- */
  footer{font-size:10px;color:var(--muted);letter-spacing:.03em}

  /* ---- 棋盘 ---- */
  .stage{display:flex;align-items:center;justify-content:flex-start;position:relative}
  #board{
    position:relative;
    background:var(--board);
    box-shadow:var(--shadow);
    overflow:hidden;
    max-width:100%;max-height:100%;
    touch-action:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .tile{
    position:absolute;top:0;left:0;
    background-repeat:no-repeat;
    --eT:var(--seam);--eR:var(--seam);--eB:var(--seam);--eL:var(--seam);
    transition:transform .22s cubic-bezier(.3,1.1,.5,1);
    will-change:transform;
    cursor:grab;
    z-index:1;
  }
  .tile::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    box-shadow:
      inset 0  2px 0 -1px var(--eT),
      inset -2px 0 0 -1px var(--eR),
      inset 0 -2px 0 -1px var(--eB),
      inset  2px 0 0 -1px var(--eL);
  }
  .tile.drag{
    z-index:20;cursor:grabbing;
    transition:none;
    --eT:var(--accent);--eR:var(--accent);--eB:var(--accent);--eL:var(--accent);
    filter:drop-shadow(0 8px 14px rgba(17,20,24,.35));
  }
  .tile.snap{animation:snap .45s ease-out}
  @keyframes snap{
    0%{filter:brightness(1.5) saturate(.7)}
    100%{filter:none}
  }
  #board.solved .tile{--eT:transparent;--eR:transparent;--eB:transparent;--eL:transparent;cursor:default}

  .ghost{
    position:absolute;top:0;left:0;pointer-events:none;z-index:3;
    border:2px dashed var(--accent);background:var(--accent-soft);
    opacity:.8;
  }

  .flash{
    position:absolute;inset:0;pointer-events:none;z-index:25;
    background:linear-gradient(105deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.6) 50%,rgba(255,255,255,0) 60%);
    background-size:300% 100%;background-position:120% 0;opacity:0;
  }
  .flash.go{animation:sweep .85s ease-out}
  @keyframes sweep{0%{opacity:1;background-position:120% 0}100%{opacity:1;background-position:-120% 0}}

  /* ---- HUD ---- */
  .hud{display:flex;justify-content:space-between;gap:10px;padding:0 4px}
  .stat{display:flex;flex-direction:column;gap:2px}
  .stat b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
  .stat span{font-size:10px;color:var(--muted)}
  .stat.pieces b{color:var(--group)}

  /* ---- 按钮 ---- */
  .controls{display:flex;gap:7px}
  button{
    font:inherit;font-size:14px;font-weight:600;
    border:1px solid var(--line-2);
    background:var(--bg);color:var(--ink);
    padding:11px 8px;flex:1;cursor:pointer;
    transition:background .15s,border-color .15s,color .15s,transform .08s;
    -webkit-tap-highlight-color:transparent;
  }
  button:active{transform:scale(.97);background:var(--surface)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* ---- 原图预览 ---- */
  #peek{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.9);z-index:30;
    opacity:0;pointer-events:none;transition:opacity .18s;
  }
  #peek.show{opacity:1}
  #peek img{box-shadow:var(--shadow-lift);max-width:90%;max-height:90%}

  /* ---- 结算层 ---- */
  .sheet{
    position:fixed;inset:0;z-index:40;
    display:flex;align-items:center;justify-content:center;padding:24px;
    background:rgba(255,255,255,.82);backdrop-filter:blur(4px);
    touch-action:none;              /* 遮罩空白处滑动不该滚到底层页面 */
    overscroll-behavior:contain;
  }
  .sheet[hidden]{display:none!important}
  .card{
    width:100%;max-width:330px;text-align:center;
    overscroll-behavior:contain;
    background:var(--bg);border:1px solid var(--line);
    padding:24px 20px 18px;box-shadow:var(--shadow-lift);
    animation:rise .3s cubic-bezier(.2,.9,.3,1.1);
  }
  @keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}}
  .card .kicker{font-size:12px;color:var(--accent);font-weight:700}
  .card h2{margin:6px 0 4px;font-size:24px;font-weight:700}
  .card p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.6}
  .scores{display:flex;justify-content:center;gap:20px;margin:12px 0 18px}
  .scores div{display:flex;flex-direction:column;gap:2px}
  .scores b{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
  .scores span{font-size:10px;color:var(--muted)}
  .card .primary{padding:8px 18px;flex:0 0 auto}
  .card .thumb{width:100px;margin-bottom:4px;box-shadow:var(--shadow)}
  .medals{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-bottom:16px}
  .medals img{width:50px;box-shadow:var(--shadow)}

  /* ---- 选关 ---- */
  .card.levels{
    position:relative;max-width:340px;text-align:left;
    max-height:100%;overflow-y:auto;
    touch-action:pan-y;             /* 弹窗内容自己能纵向滚 */
    -webkit-overflow-scrolling:touch;
  }
  .card .iconbtn{
    position:absolute;top:10px;right:10px;
    width:28px;height:28px;padding:0;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    border:0;background:transparent;color:var(--muted);
  }
  .card .iconbtn:hover{color:var(--ink)}
  .card .iconbtn:active{transform:none;background:transparent}
  .lvgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 0}
  .lvcell{
    display:flex;flex-direction:column;align-items:flex-start;gap:1px;
    padding:7px 8px;border:1px solid var(--line);background:var(--bg);
    text-align:left;font:inherit;cursor:pointer;flex:0 0 auto;
    transition:border-color .15s,background .15s;
  }
  .lvcell:hover{border-color:var(--line-2)}
  .lvcell .no{font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.06em}
  .lvcell.done .no{color:var(--group)}
  .lvcell .nm{font-size:15px;font-weight:700;color:var(--ink);line-height:1.4}
  .lvcell .meta{font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .lvcell.now{border-color:var(--accent);background:var(--accent-soft)}
  .lvcell.now .nm{color:var(--accent)}

  @media (max-height:660px){
    h1{font-size:30px}
    .stat b{font-size:16px}
    button{padding:9px 6px}
  }
  @media (prefers-reduced-motion:reduce){
    .tile,.card,.flash.go,.tile.snap{transition:none;animation:none}
  }
</style>
</head>
<body>
<!-- ARTIFACT-BODY-START -->
<div id="app">
  <header class="brandbar">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect x=".8" y=".8" width="13.4" height="13.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M2.4 13.2 L2.4 8.6 L5.6 11.2 L8.6 5.2 L13 13.2 Z" fill="currentColor"/>
        <rect x="17.8" y=".8" width="13.4" height="13.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="24.5" cy="7.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <rect x=".8" y="17.8" width="13.4" height="13.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M2.6 26.4 q2.6 -2.8 5.2 0 t5.2 0" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <rect x="17.8" y="17.8" width="13.4" height="13.4" fill="var(--accent)"/>
      </svg>
      <span class="brandname">时光拼图</span>
      <button id="btnLv" type="button">选关</button>
  </header>

  <div class="mid" id="mid">
    <div class="hgroup" id="hg">
      <h1 id="lvName">日出</h1>
      <div class="eyebrow" id="lvNum">第 1 关</div>
    </div>

    <div class="stage">
      <div id="board" aria-label="拼图棋盘">
        <div class="flash" id="flash"></div>
        <div id="peek"><img id="peekImg" alt="完整原图"></div>
      </div>
    </div>

    <div class="hud" id="hud">
      <div class="stat"><b id="mv">0</b><span>步数</span></div>
      <div class="stat"><b id="tm">0:00</b><span>用时</span></div>
      <div class="stat pieces"><b id="pc">9</b><span>散块</span></div>
      <div class="stat"><b id="bs">—</b><span>最佳</span></div>
    </div>
  </div>

  <div class="bot">
    <div class="controls" id="ctl">
      <button id="btnPeek" type="button">看原图</button>
      <button id="btnNew" type="button">重打乱</button>
    </div>
    <footer>版权所有©Venico 2026</footer>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="card" id="card"></div>
</div>

<div class="sheet" id="lvSheet" hidden>
  <div class="card levels">
    <button class="iconbtn" id="lvClose" type="button" aria-label="关闭">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
        <path d="M5.5 5.5 L18.5 18.5 M18.5 5.5 L5.5 18.5"></path>
      </svg>
    </button>
    <div class="kicker">选择关卡</div>
    <div class="lvgrid" id="lvGrid"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ========== 关卡 ========== */
  /* 块数封顶在 10×12=120：手机可用宽 311px，10 列时每块 31px，再多就点不准了。
     30 关 = 10 个场景 × 3 种色调，tint 是画完后整体调色用的滤镜。 */
  /* 块数封顶在 10×12=120：手机可用宽约 311px，10 列时每块 31~34px，再多就点不准了。
     30 关 = 10 个 80 后童年场景 × 不同色调，tint 是画完后整体调色用的滤镜。
     彩条只出现一次且放在低关卡：大片同色条切到上百块会有大量无法分辨的块。 */
  var LEVELS = [
    {name:"卡带", cols:3,  rows:3,  art:0},
    {name:"老楼", cols:3,  rows:4,  art:1},
    {name:"汽水", cols:4,  rows:4,  art:2},
    {name:"弄堂", cols:4,  rows:5,  art:3},
    {name:"磁带", cols:5,  rows:5,  art:4},
    {name:"彩条", cols:5,  rows:6,  art:9},
    {name:"黑板", cols:6,  rows:6,  art:5},
    {name:"弹珠", cols:6,  rows:7,  art:6},
    {name:"像素", cols:7,  rows:7,  art:7},
    {name:"洋画", cols:7,  rows:8,  art:8},

    {name:"闯关", cols:7,  rows:9,  art:0, tint:"hue-rotate(-12deg) saturate(1.4) contrast(1.08)"},
    {name:"晚归", cols:8,  rows:8,  art:1, tint:"sepia(.55) hue-rotate(-14deg) saturate(1.55) brightness(1.05)"},
    {name:"冰柜", cols:8,  rows:9,  art:2, tint:"hue-rotate(150deg) saturate(.95) brightness(1.02)"},
    {name:"红墙", cols:8,  rows:10, art:3, tint:"hue-rotate(-20deg) saturate(1.8) brightness(1.02)"},
    {name:"老歌", cols:9,  rows:9,  art:4, tint:"sepia(.55) saturate(1.25) brightness(1.14)"},
    {name:"粉笔", cols:9,  rows:10, art:5, tint:"saturate(.28) brightness(1.22) contrast(1.05)"},
    {name:"琉璃", cols:9,  rows:11, art:6, tint:"hue-rotate(78deg) saturate(1.3) contrast(1.05)"},
    {name:"水关", cols:10, rows:10, art:7, tint:"sepia(1) saturate(2.8) hue-rotate(155deg) brightness(.95) contrast(1.05)"},
    {name:"贴纸", cols:10, rows:11, art:8, tint:"hue-rotate(-30deg) saturate(1.35) brightness(1.1)"},
    {name:"旧卡", cols:10, rows:12, art:0, tint:"sepia(.5) saturate(.95) brightness(1.06) contrast(1.06)"},

    {name:"冬楼", cols:10, rows:12, art:1, tint:"hue-rotate(15deg) saturate(.4) brightness(1.1) contrast(1.08)"},
    {name:"糖纸", cols:10, rows:12, art:2, tint:"hue-rotate(-28deg) saturate(1.4) brightness(1.08)"},
    {name:"苔痕", cols:10, rows:12, art:3, tint:"hue-rotate(55deg) saturate(1.2) brightness(.88) contrast(1.08)"},
    {name:"翻录", cols:10, rows:12, art:4, tint:"hue-rotate(150deg) saturate(.85) brightness(1.1) contrast(1.06)"},
    {name:"值日", cols:10, rows:12, art:5, tint:"sepia(.5) saturate(1.15) brightness(1.08) contrast(1.05)"},
    {name:"珠光", cols:10, rows:12, art:6, tint:"sepia(.75) saturate(1.8) hue-rotate(-8deg) brightness(1.16)"},
    {name:"夜关", cols:10, rows:12, art:7, tint:"saturate(.7) brightness(.52) hue-rotate(10deg) contrast(1.2)"},
    {name:"拍画", cols:10, rows:12, art:8, tint:"sepia(.62) saturate(.95) brightness(.98) contrast(1.06)"},
    {name:"玻璃", cols:10, rows:12, art:6, tint:"hue-rotate(115deg) saturate(.9) brightness(1.12)"},
    {name:"通关", cols:10, rows:12, art:7, tint:"sepia(.9) saturate(1.7) hue-rotate(-10deg) brightness(1.14)"}
  ];

  /* ========== 绘图 ========== */
  var ARTS=[cartridge, flats, shop, brickwall, cassette, chalkboard, marbles, bitgame, flipcards, testcard];
  function makeImage(idx, cols, rows){
    var L=LEVELS[idx];
    var big=Math.max(cols,rows);
    var U = big>=10 ? 84 : (big>=7 ? 108 : 132);
    var w = cols*U, h = rows*U;
    var c = document.createElement("canvas");
    c.width = w; c.height = h;
    var g = c.getContext("2d");
    ARTS[L.art](g, w, h);
    grain(g, w, h);
    vintage(g, w, h);
    if(L.tint){
      var t = document.createElement("canvas");
      t.width = w; t.height = h;
      var tg = t.getContext("2d");
      tg.filter = L.tint;              /* 老浏览器不认就是原色，不影响玩 */
      tg.drawImage(c, 0, 0);
      c = t;
    }
    var sc = 160/w;
    var s2 = document.createElement("canvas");
    s2.width = Math.round(w*sc); s2.height = Math.round(h*sc);
    s2.getContext("2d").drawImage(c, 0, 0, s2.width, s2.height);
    return {src:c.toDataURL("image/jpeg", 0.92), thumb:s2.toDataURL("image/jpeg", 0.8)};
  }
  function lg(g,x0,y0,x1,y1,stops){
    var grd=g.createLinearGradient(x0,y0,x1,y1);
    stops.forEach(function(s){ grd.addColorStop(s[0],s[1]); });
    return grd;
  }
  function poly(g,pts,fill){
    g.beginPath(); g.moveTo(pts[0][0],pts[0][1]);
    for(var i=1;i<pts.length;i++) g.lineTo(pts[i][0],pts[i][1]);
    g.closePath(); g.fillStyle=fill; g.fill();
  }
  function grain(g,w,h){
    var n=Math.round(w*h/90);
    for(var i=0;i<n;i++){
      g.fillStyle = Math.random()<.5 ? "rgba(255,255,255,.055)" : "rgba(0,0,0,.055)";
      g.fillRect(Math.random()*w, Math.random()*h, 1.4, 1.4);
    }
  }
  /* 复古年代感：淡黄叠色 + 暗角 */
  function vintage(g,w,h){
    g.fillStyle="rgba(214,178,110,.10)";
    g.fillRect(0,0,w,h);
    var vg=g.createRadialGradient(w/2,h/2,Math.min(w,h)*.34,w/2,h/2,Math.max(w,h)*.72);
    vg.addColorStop(0,"rgba(38,26,14,0)");
    vg.addColorStop(1,"rgba(38,26,14,.30)");
    g.fillStyle=vg; g.fillRect(0,0,w,h);
  }

  /* 1 红白机卡带墙 */
  function cartridge(g,w,h){
    g.fillStyle="#6B4A2F"; g.fillRect(0,0,w,h);
    g.strokeStyle="rgba(40,24,12,.22)"; g.lineWidth=Math.max(1,w*.002);
    for(var i=0;i<26;i++){
      var wy=Math.random()*h;
      g.beginPath(); g.moveTo(0,wy);
      g.bezierCurveTo(w*.3,wy+h*.008,w*.6,wy-h*.008,w,wy); g.stroke();
    }
    var cols=["#C8412F","#D9822B","#E0C044","#3E7C4F","#2F6DA8","#7A4A9E","#B5B5AD","#2A2A2E","#D46A8C","#5FA8A0"];
    var rows=5, rh=h/rows;
    for(var r=0;r<rows;r++){
      var y0=r*rh;
      g.fillStyle="#54381F"; g.fillRect(0,y0+rh*.88,w,rh*.12);
      g.fillStyle="rgba(255,255,255,.12)"; g.fillRect(0,y0+rh*.88,w,rh*.02);
      var x=w*.008;
      while(x<w*.985){
        var cw=w*(.052+Math.random()*.03), ch=rh*(.72+Math.random()*.12);
        var cy=y0+rh*.88-ch;
        g.fillStyle=cols[Math.floor(Math.random()*cols.length)];
        g.fillRect(x,cy,cw,ch);
        g.fillStyle="rgba(0,0,0,.28)"; g.fillRect(x+cw*.2,cy,cw*.6,ch*.055);
        g.fillStyle="#EDE6D2"; g.fillRect(x+cw*.1,cy+ch*.16,cw*.8,ch*.42);
        g.fillStyle="rgba(40,30,20,.5)";
        for(var t=0;t<3;t++) g.fillRect(x+cw*.18, cy+ch*.23+t*ch*.1, cw*(.26+Math.random()*.38), ch*.045);
        g.fillStyle="rgba(255,255,255,.16)"; g.fillRect(x,cy,cw*.12,ch);
        g.fillStyle="rgba(0,0,0,.22)"; g.fillRect(x+cw*.89,cy,cw*.11,ch);
        x += cw + w*.005;
      }
    }
  }

  /* 8 八位机画面 */
  function bitgame(g,w,h){
    var P=Math.max(3, Math.round(Math.min(w,h)/44));
    function snap(v){ return Math.round(v/P)*P; }
    function px(x,y,ww,hh,col){ g.fillStyle=col; g.fillRect(snap(x),snap(y),snap(ww),snap(hh)); }
    g.fillStyle="#5C94FC"; g.fillRect(0,0,w,h);
    function cloud(cx,cy,sc){
      px(cx,cy,P*6*sc,P*2*sc,"#FFFFFF");
      px(cx+P*sc,cy-P*sc,P*4*sc,P*2*sc,"#FFFFFF");
      px(cx+P*2*sc,cy-P*2*sc,P*2*sc,P*2*sc,"#FFFFFF");
      px(cx+P*sc,cy+P*2*sc,P*4*sc,P*sc,"#E8ECF8");
    }
    for(var i=0;i<11;i++) cloud(Math.random()*w, h*(.03+Math.random()*.42), .7+Math.random()*.6);
    function bush(bx,by,sc){
      px(bx,by,P*8*sc,P*3*sc,"#00A800");
      px(bx+P*2*sc,by-P*2*sc,P*4*sc,P*2*sc,"#00A800");
      px(bx+P*sc,by+P*sc,P*6*sc,P*sc,"#007000");
    }
    for(var b2=0;b2<7;b2++) bush(Math.random()*w, h*(.5+Math.random()*.2), .6+Math.random()*.6);
    /* 三行砖块／问号块／金币 */
    [.22,.4,.58].forEach(function(fy,fi){
      var by2=h*fy;
      for(var x2=(fi%2?P*2:0); x2<w; x2+=P*2){
        var rr=Math.random();
        if(rr<.42){
          px(x2,by2,P*2,P*2,"#C84C0C");
          g.fillStyle="rgba(0,0,0,.35)";
          g.fillRect(snap(x2),snap(by2)+P-1,P*2,2);
          g.fillRect(snap(x2)+P,snap(by2),2,P);
          g.fillRect(snap(x2),snap(by2)+P,2,P);
          g.fillStyle="rgba(255,255,255,.2)"; g.fillRect(snap(x2),snap(by2),P*2,2);
        } else if(rr<.6){
          px(x2,by2,P*2,P*2,"#E8A200");
          g.fillStyle="#7A4A00"; g.fillRect(snap(x2),snap(by2),P*2,2);
          g.fillRect(snap(x2),snap(by2)+P*2-2,P*2,2);
          px(x2+P*.55,by2+P*.45,P*.9,P*1.1,"#FFFFFF");
        } else if(rr<.72){
          g.fillStyle="#E8C547";
          g.beginPath(); g.ellipse(snap(x2)+P,snap(by2)+P,P*.55,P*.8,0,0,7); g.fill();
          g.fillStyle="#B07800";
          g.beginPath(); g.ellipse(snap(x2)+P,snap(by2)+P,P*.22,P*.5,0,0,7); g.fill();
        }
      }
    });
    for(var p=0;p<4;p++){
      var pxx=w*(.1+p*.25), ph=h*(.09+Math.random()*.12);
      px(pxx,h*.74-ph,P*4,ph,"#00A800");
      px(pxx-P,h*.74-ph,P*6,P*2,"#00A800");
      g.fillStyle="rgba(255,255,255,.25)"; g.fillRect(snap(pxx),snap(h*.74-ph),P,snap(ph));
      g.fillStyle="rgba(0,0,0,.28)"; g.fillRect(snap(pxx)+P*3,snap(h*.74-ph),P,snap(ph));
      g.fillStyle="#004000"; g.fillRect(snap(pxx)-P,snap(h*.74-ph)+P*2-2,P*6,2);
    }
    g.fillStyle="#C84C0C"; g.fillRect(0,h*.74,w,h*.26);
    g.fillStyle="rgba(0,0,0,.3)";
    for(var gy=h*.74; gy<h; gy+=P*2){
      g.fillRect(0,snap(gy),w,2);
      for(var gx=((Math.round(gy/P)%4===0)?0:P); gx<w; gx+=P*2) g.fillRect(snap(gx),snap(gy),2,P*2);
    }
    g.fillStyle="rgba(255,255,255,.22)"; g.fillRect(0,h*.74,w,2);
  }

    g.beginPath(); g.arc(w*.5,h*.34,R*.62,0,7); g.stroke();
    g.beginPath(); g.moveTo(w*.5,h*.34-R*1.1); g.lineTo(w*.5,h*.34+R*1.1); g.stroke();
    g.beginPath(); g.moveTo(w*.5-R*1.1,h*.34); g.lineTo(w*.5+R*1.1,h*.34); g.stroke();
    g.fillStyle="rgba(0,0,0,.75)"; g.fillRect(w*.34,h*.3,w*.32,h*.08);
    g.fillStyle="rgba(255,255,255,.9)";
    for(var t2=0;t2<5;t2++) g.fillRect(w*(.37+t2*.055), h*.325, w*.032, h*.03);
    g.strokeStyle="rgba(255,255,255,.7)"; g.lineWidth=Math.max(1.5,w*.003);
    [[.08,.08],[.92,.08],[.08,.92],[.92,.92]].forEach(function(c3){
      var cx=w*c3[0], cy=h*c3[1], s3=Math.min(w,h)*.05;
      g.beginPath(); g.moveTo(cx-s3,cy); g.lineTo(cx+s3,cy);
      g.moveTo(cx,cy-s3); g.lineTo(cx,cy+s3); g.stroke();
    });
    g.fillStyle="rgba(0,0,0,.16)";
    for(var y2=0;y2<h;y2+=Math.max(2,h*.006)) g.fillRect(0,y2,w,1);
    for(var n=0;n<Math.round(w*h/420);n++){
      g.fillStyle="rgba(255,255,255,"+(Math.random()*.4)+")";
      g.fillRect(Math.random()*w,Math.random()*h,2,2);
    }
  }

  /* ========== 状态 ========== */
  var S = {
    lv:0, cols:3, rows:3, n:9, block:0,
    order:[],   /* order[格子] = 块编号 */
    pos:[],     /* pos[块编号] = 格子 */
    grp:[],     /* grp[块编号] = 组代表 */
    moves:0, t0:0, timer:null, solved:false,
    src:"", thumb:"", best:{}, cleared:0, thumbs:[]
  };
  var $ = function(id){ return document.getElementById(id); };
  var board=$("board"), sheet=$("sheet"), card=$("card");
  var els=[];   /* els[块编号] = DOM */

  function load(){
    try{
      var raw=localStorage.getItem("shiguang.v1");
      if(raw){ var d=JSON.parse(raw); S.best=d.best||{}; S.cleared=d.cleared||0; }
    }catch(e){}
  }
  function save(){
    try{ localStorage.setItem("shiguang.v1", JSON.stringify({best:S.best,cleared:S.cleared})); }catch(e){}
  }

  /* ========== 分组：原图相邻 + 当前偏移相同 = 同一整块 ========== */
  function computeGroups(){
    var n=S.n, cols=S.cols, rows=S.rows, i;
    var pos=new Array(n);
    for(i=0;i<n;i++) pos[S.order[i]]=i;
    S.pos=pos;

    var parent=new Array(n);
    for(i=0;i<n;i++) parent[i]=i;
    function find(x){ while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; }
    function uni(a,b){ a=find(a); b=find(b); if(a!==b) parent[b]=a; }
    function dr(id){ return Math.floor(pos[id]/cols) - Math.floor(id/cols); }
    function dc(id){ return (pos[id]%cols) - (id%cols); }

    for(i=0;i<n;i++){
      var r=Math.floor(i/cols), c=i%cols;
      if(c+1<cols && dr(i)===dr(i+1) && dc(i)===dc(i+1)) uni(i,i+1);
      if(r+1<rows && dr(i)===dr(i+cols) && dc(i)===dc(i+cols)) uni(i,i+cols);
    }
    var g=new Array(n);
    for(i=0;i<n;i++) g[i]=find(i);
    S.grp=g;
  }
  function groupMembers(id){
    var key=S.grp[id], out=[];
    for(var i=0;i<S.n;i++) if(S.grp[i]===key) out.push(i);
    return out;
  }
  function groupCount(){
    var seen={}, k=0;
    for(var i=0;i<S.n;i++) if(!seen[S.grp[i]]){ seen[S.grp[i]]=1; k++; }
    return k;
  }

  /* ========== 打乱 ========== */
  function shuffle(){
    var n=S.n, a=[], i, tries=0;
    do{
      a=[];
      for(i=0;i<n;i++) a.push(i);
      for(i=n-1;i>0;i--){
        var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t;
      }
      S.order=a;
      computeGroups();
      tries++;
    }while(tries<40 && (groupCount() < n-Math.floor(n/4) || isSolved()));
    /* 开局允许零星几处偶然接上，但不能一上来就连成大片 */
  }
  function isSolved(){
    for(var i=0;i<S.n;i++) if(S.order[i]!==i) return false;
    return true;
  }

  /* ========== 移动：整块平移，被顶掉的块回填空位 ========== */
  function applyMove(members, dR, dC){
    if(!dR && !dC) return false;
    var cols=S.cols, rows=S.rows, i;
    var src=members.map(function(m){ return S.pos[m]; });
    var dst=[], inSrc={}, inDst={};

    for(i=0;i<src.length;i++){
      var r=Math.floor(src[i]/cols)+dR, c=(src[i]%cols)+dC;
      if(r<0||r>=rows||c<0||c>=cols) return false;   /* 出界不给动 */
      dst.push(r*cols+c);
      inSrc[src[i]]=1;
    }
    dst.forEach(function(s){ inDst[s]=1; });

    var newOrder=S.order.slice();
    for(i=0;i<src.length;i++) newOrder[dst[i]] = S.order[src[i]];

    var free={}, hit=[];
    src.forEach(function(s){ if(!inDst[s]) free[s]=1; });
    dst.forEach(function(s){ if(!inSrc[s]) hit.push(s); });

    /* 被顶掉的块沿反方向找最近空位，整行整列平移时就是自然的循环移位 */
    hit.sort(function(a,b){
      return (Math.floor(b/cols)*dR + (b%cols)*dC) - (Math.floor(a/cols)*dR + (a%cols)*dC);
    });
    var pending=[];
    hit.forEach(function(s){
      var tile=S.order[s];
      var r=Math.floor(s/cols)-dR, c=(s%cols)-dC, target=-1;
      while(r>=0 && r<rows && c>=0 && c<cols){
        var p=r*cols+c;
        if(free[p]){ target=p; break; }
        r-=dR; c-=dC;
      }
      if(target>=0){ newOrder[target]=tile; delete free[target]; }
      else pending.push(tile);
    });
    var left=Object.keys(free).map(Number);
    pending.forEach(function(t,k){ if(left[k]!==undefined) newOrder[left[k]]=t; });

    /* 安全阀：结果必须还是一个完整排列，否则放弃这一步 */
    var check=new Array(S.n);
    for(i=0;i<S.n;i++){
      var v=newOrder[i];
      if(v===undefined || check[v]) return false;
      check[v]=1;
    }
    S.order=newOrder;
    return true;
  }

  /* ========== 渲染 ========== */
  function build(lv, keepImage){
    var L=LEVELS[lv];
    S.lv=lv; S.cols=L.cols; S.rows=L.rows; S.n=L.cols*L.rows;
    S.moves=0; S.solved=false;
    stopTimer(); S.t0=0;
    $("tm").textContent="0:00"; $("mv").textContent="0";

    if(!keepImage || !S.src){
      var img=makeImage(lv,L.cols,L.rows);
      S.src=img.src; S.thumb=img.thumb;
    }
    $("peekImg").src=S.src;
    $("lvNum").textContent="第 "+(lv+1)+" 关";
    $("lvName").textContent=L.name;
    $("bs").textContent = S.best[lv] ? S.best[lv]+" 步" : "—";

    board.classList.remove("solved");
    board.querySelectorAll(".tile,.ghost").forEach(function(e){ e.remove(); });
    els=[];

    shuffle();

    for(var id=0; id<S.n; id++){
      var el=document.createElement("div");
      el.className="tile";
      el.style.backgroundImage="url("+S.src+")";
      el.dataset.id=id;
      els[id]=el;
      board.appendChild(el);
    }
    alignHeader();
    fit();
    render(true);
  }

  /* 中文字形在字面框里自带左空隙（「日」在 40px 下是 7.4px，「潮」只有 1.4px），
     不补偿的话大标题看着就没跟下面的小字对齐。按当前字号量首字，逐关补掉。 */
  function opticalAlign(el){
    if(!el) return;
    var t=(el.textContent||"").trim();
    if(!t){ el.style.marginLeft=""; return; }
    var cs=getComputedStyle(el);
    var ctx=opticalAlign.ctx || (opticalAlign.ctx=document.createElement("canvas").getContext("2d"));
    ctx.font=cs.fontWeight+" "+parseFloat(cs.fontSize)+"px "+cs.fontFamily;
    var m=ctx.measureText(t.charAt(0));
    var inset=-(m.actualBoundingBoxLeft||0);          /* 老浏览器没这属性就不补 */
    if(!isFinite(inset) || inset<0) inset=0;
    el.style.marginLeft = inset ? (-inset).toFixed(2)+"px" : "";
  }
  function alignHeader(){ opticalAlign($("lvName")); opticalAlign($("lvNum")); }

  function fit(){
    var mid=$("mid"), cs=getComputedStyle(mid);
    var gap=parseFloat(cs.rowGap)||parseFloat(cs.gap)||14;
    var aw=mid.clientWidth;
    var ah=mid.clientHeight - $("hg").offsetHeight - $("hud").offsetHeight - gap*2;
    if(aw<=0||ah<=0) return;
    /* 块宽取成整数个设备像素：百分比宽度会让边界落在半像素上，
       相邻块之间就露出棋盘底色，看着像一条白线 */
    var dpr=window.devicePixelRatio||1;
    var raw=Math.min(aw/S.cols, ah/S.rows);
    var block=Math.floor(raw*dpr)/dpr;
    if(block<=0) return;
    S.block=block;
    board.style.width=(block*S.cols)+"px";
    board.style.height=(block*S.rows)+"px";
    applyMetrics();
    render(true);
  }

  /* 块的尺寸和图案偏移都按像素算，跟着棋盘尺寸变 */
  function applyMetrics(){
    var b=S.block, bw=b*S.cols, bh=b*S.rows;
    for(var id=0; id<S.n; id++){
      var el=els[id];
      if(!el) continue;
      var r=Math.floor(id/S.cols), c=id%S.cols;
      el.style.width=b+"px";
      el.style.height=b+"px";
      el.style.backgroundSize=bw+"px "+bh+"px";
      el.style.backgroundPosition=(-c*b)+"px "+(-r*b)+"px";
    }
  }
  window.addEventListener("resize", alignHeader);

  function render(instant){
    var cols=S.cols, rows=S.rows;
    for(var slot=0; slot<S.n; slot++){
      var id=S.order[slot], el=els[id];
      if(!el) continue;
      var r=Math.floor(slot/cols), c=slot%cols;
      if(instant) el.style.transition="none";
      el.style.transform="translate("+(c*S.block)+"px,"+(r*S.block)+"px)";
      if(instant){ void el.offsetWidth; el.style.transition=""; }
      /* 组内部不画缝，组的外圈画一条绿线 */
      var mine=S.grp[id], solved=board.classList.contains("solved");
      var sides=[[r-1,c,"--eT"],[r,c+1,"--eR"],[r+1,c,"--eB"],[r,c-1,"--eL"]];
      for(var k=0;k<4;k++){
        var nr=sides[k][0], nc=sides[k][1], val;
        if(solved) val="transparent";
        else if(nr<0||nr>=rows||nc<0||nc>=cols){
          val = groupSize(mine)>1 ? "var(--group)" : "var(--seam)";
        }else{
          var nb=S.order[nr*cols+nc];
          if(S.grp[nb]===mine) val="transparent";
          else val = groupSize(mine)>1 ? "var(--group)" : "var(--seam)";
        }
        el.style.setProperty(sides[k][2], val);
      }
    }
    $("pc").textContent = groupCount();
  }
  var _sizeCache=null;
  function groupSize(key){
    if(!_sizeCache || _sizeCache.stamp!==S.grp){
      var m={};
      for(var i=0;i<S.n;i++) m[S.grp[i]]=(m[S.grp[i]]||0)+1;
      _sizeCache={stamp:S.grp, map:m};
    }
    return _sizeCache.map[key]||1;
  }

  /* ========== 拖动 ========== */
  var drag=null, ghosts=[];
  function clearGhosts(){ ghosts.forEach(function(g){ g.remove(); }); ghosts=[]; }

  board.addEventListener("pointerdown", function(e){
    if(S.solved) return;
    /* 按落点所在的格子取块：归位动画还没走完时，也不会抓错 */
    var b=board.getBoundingClientRect();
    var tw=b.width/S.cols, th=b.height/S.rows;
    var hc=Math.floor((e.clientX-b.left)/tw), hr=Math.floor((e.clientY-b.top)/th);
    if(hr<0||hr>=S.rows||hc<0||hc>=S.cols) return;
    var id=S.order[hr*S.cols+hc];
    if(id===undefined) return;
    var members=groupMembers(id);
    var cells=members.map(function(m){
      var s=S.pos[m];
      return {r:Math.floor(s/S.cols), c:s%S.cols};
    });
    var minR=Math.min.apply(null,cells.map(function(x){return x.r;}));
    var maxR=Math.max.apply(null,cells.map(function(x){return x.r;}));
    var minC=Math.min.apply(null,cells.map(function(x){return x.c;}));
    var maxC=Math.max.apply(null,cells.map(function(x){return x.c;}));

    drag={
      members:members, x0:e.clientX, y0:e.clientY, tw:tw, th:th,
      minDx:(0-minC)*tw, maxDx:(S.cols-1-maxC)*tw,
      minDy:(0-minR)*th, maxDy:(S.rows-1-maxR)*th,
      dR:0, dC:0
    };
    members.forEach(function(m){
      els[m].classList.add("drag");
      var s=S.pos[m], r=Math.floor(s/S.cols), c=s%S.cols;
      var gh=document.createElement("div");
      gh.className="ghost";
      gh.style.width=S.block+"px";
      gh.style.height=S.block+"px";
      gh.style.transform="translate("+(c*S.block)+"px,"+(r*S.block)+"px)";
      gh.dataset.r=r; gh.dataset.c=c;
      board.appendChild(gh);
      ghosts.push(gh);
    });
    try{ board.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });

  board.addEventListener("pointermove", function(e){
    if(!drag) return;
    var dx=Math.max(drag.minDx, Math.min(drag.maxDx, e.clientX-drag.x0));
    var dy=Math.max(drag.minDy, Math.min(drag.maxDy, e.clientY-drag.y0));
    drag.dC=Math.round(dx/drag.tw);
    drag.dR=Math.round(dy/drag.th);
    drag.members.forEach(function(m){
      var s=S.pos[m], r=Math.floor(s/S.cols), c=s%S.cols;
      els[m].style.transform="translate("+((c*S.block)+dx)+"px,"+((r*S.block)+dy)+"px)";
    });
    ghosts.forEach(function(gh){
      var r=+gh.dataset.r + drag.dR, c=+gh.dataset.c + drag.dC;
      gh.style.transform="translate("+(c*S.block)+"px,"+(r*S.block)+"px)";
    });
    e.preventDefault();
  });

  function endDrag(e){
    if(!drag) return;
    var d=drag;
    /* 落点以松手位置为准，中途没收到 move 事件也能正确判定 */
    if(e && typeof e.clientX==="number"){
      var dx=Math.max(d.minDx, Math.min(d.maxDx, e.clientX-d.x0));
      var dy=Math.max(d.minDy, Math.min(d.maxDy, e.clientY-d.y0));
      d.dC=Math.round(dx/d.tw);
      d.dR=Math.round(dy/d.th);
    }
    drag=null;
    clearGhosts();
    d.members.forEach(function(m){ els[m].classList.remove("drag"); });

    var before={};
    for(var i=0;i<S.n;i++) before[i]=groupSize(S.grp[i]);

    var ok=applyMove(d.members, d.dR, d.dC);
    if(ok){
      S.moves++; $("mv").textContent=S.moves;
      if(!S.timer) startTimer();
      computeGroups(); _sizeCache=null;
      render();
      /* 新接上的块闪一下 */
      for(var k=0;k<S.n;k++){
        if(groupSize(S.grp[k]) > before[k]){
          (function(el){
            el.classList.remove("snap"); void el.offsetWidth; el.classList.add("snap");
            setTimeout(function(){ el.classList.remove("snap"); }, 500);
          })(els[k]);
        }
      }
      check();
    }else{
      render();
    }
  }
  board.addEventListener("pointerup", endDrag);
  board.addEventListener("pointercancel", function(){
    /* 手势被系统打断：原样放回，不算一步 */
    if(!drag) return;
    var d=drag; drag=null;
    clearGhosts();
    d.members.forEach(function(m){ els[m].classList.remove("drag"); });
    render();
  });

  /* ========== 过关 ========== */
  function check(){
    if(!isSolved()) return;
    S.solved=true;
    stopTimer();
    board.classList.add("solved");
    render();
    var f=$("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
    var prev=S.best[S.lv];
    if(!prev || S.moves<prev) S.best[S.lv]=S.moves;
    if(S.lv+1>S.cleared) S.cleared=S.lv+1;
    S.thumbs[S.lv]=S.thumb||S.src;
    save();
    setTimeout(win, 800);
  }
  function startTimer(){
    S.t0=Date.now();
    S.timer=setInterval(function(){
      $("tm").textContent=fmt(Math.floor((Date.now()-S.t0)/1000));
    },250);
  }
  function stopTimer(){ if(S.timer){ clearInterval(S.timer); S.timer=null; } }
  function elapsed(){ return S.t0 ? Math.floor((Date.now()-S.t0)/1000) : 0; }
  function fmt(s){ return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2); }

  function win(){
    var last=S.lv===LEVELS.length-1, secs=elapsed();
    if(last){
      var medals=S.thumbs.map(function(src,i){
        return src ? '<img src="'+src+'" alt="第'+(i+1)+'关 '+LEVELS[i].name+'">' : "";
      }).join("");
      var total=Object.keys(S.best).reduce(function(a,k){ return a+S.best[k]; },0);
      card.innerHTML=
        '<div class="kicker">全部通关</div>'+
        '<h2>五关全通</h2>'+
        '<p>那些年的东西，都回到原来的位置了。</p>'+
        '<div class="medals">'+medals+'</div>'+
        '<div class="scores"><div><b>'+total+'</b><span>累计步数</span></div>'+
        '<div><b>'+LEVELS.length+'</b><span>完成关卡</span></div></div>'+
        '<button class="primary" id="again" type="button">从第 1 关重玩</button>';
      $("again").onclick=function(){ sheet.hidden=true; syncLock(); S.src=""; build(0); };
    }else{
      var nx=LEVELS[S.lv+1];
      card.innerHTML=
        '<div class="kicker">第 '+(S.lv+1)+' 关完成</div>'+
        '<h2>'+LEVELS[S.lv].name+'</h2>'+
        '<img class="thumb" src="'+S.src+'" alt="本关完整图">'+
        '<div class="scores"><div><b>'+S.moves+'</b><span>步数</span></div>'+
        '<div><b>'+fmt(secs)+'</b><span>用时</span></div>'+
        '<div><b>'+(nx.cols*nx.rows)+'</b><span>下关块数</span></div></div>'+
        '<button class="primary" id="next" type="button">进入下一关</button>';
      $("next").onclick=function(){ sheet.hidden=true; syncLock(); S.src=""; build(S.lv+1); };
    }
    sheet.hidden=false;
    syncLock();
  }

  /* ========== 选关 ========== */
  function openPicker(){
    var g=$("lvGrid"); g.innerHTML="";
    for(var i=0;i<LEVELS.length;i++){
      var L=LEVELS[i];
      var cell=document.createElement("button");
      cell.type="button";
      cell.className="lvcell"+(i<S.cleared?" done":"")+(i===S.lv?" now":"");
      cell.innerHTML='<span class="no">'+(i+1<10?"0":"")+(i+1)+'</span>'+
        '<span class="nm">'+L.name+'</span>'+
        '<span class="meta">'+(L.cols*L.rows)+' 块'+(S.best[i]?' · '+S.best[i]+' 步':'')+'</span>';
      cell.onclick=(function(idx){ return function(){
        $("lvSheet").hidden=true; sheet.hidden=true; syncLock(); S.src=""; build(idx);
      }; })(i);
      g.appendChild(cell);
    }
    $("lvSheet").hidden=false;
    syncLock();
  }
  /* 在遮罩空白处滑动时，手势会被底层页面接走，之后连弹窗内容都滚不动了。
     这里把遮罩上的滑动吃掉，只放行卡片内部的滚动。 */
  function guardSheet(el){
    el.addEventListener("touchmove", function(e){
      var box=e.target && e.target.closest ? e.target.closest(".card") : null;
      if(!box) e.preventDefault();
    }, {passive:false});
  }
  guardSheet($("lvSheet"));
  guardSheet(sheet);

  /* 直接按两个弹窗的实际状态决定要不要锁页面，比开关计数不容易算漏 */
  function syncLock(){
    var open = !$("lvSheet").hidden || !sheet.hidden;
    document.body.style.overflow = open ? "hidden" : "";
  }

  $("btnLv").onclick=openPicker;
  $("lvClose").onclick=function(){ $("lvSheet").hidden=true; syncLock(); };
  $("lvSheet").addEventListener("click", function(e){ if(e.target===this){ this.hidden=true; syncLock(); } });

  /* ========== 按钮 ========== */
  var peek=$("peek"), pb=$("btnPeek");
  function showPeek(on){ peek.classList.toggle("show",on); }
  ["mousedown","touchstart"].forEach(function(ev){
    pb.addEventListener(ev,function(e){ e.preventDefault(); showPeek(true); },{passive:false});
  });
  ["mouseup","mouseleave","touchend","touchcancel"].forEach(function(ev){
    pb.addEventListener(ev,function(){ showPeek(false); });
  });
  $("btnNew").onclick=function(){ build(S.lv,true); };

  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", function(){ setTimeout(fit,200); });

  /* ========== 启动 / 热更新 ========== */
  function boot(state){
    load();
    var lv=(state && typeof state.lv==="number") ? state.lv : 0;
    build(Math.min(lv, LEVELS.length-1));
