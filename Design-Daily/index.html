<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="设计日报，每天发现工业、交互、AI、动效、家具与出行设计的新动向。"><title>设计日报 · 每天发现好设计</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='20' fill='%23dcf344'/%3E%3Cpath d='M12 10h7a10 10 0 010 20h-7zm6 5v10h1a5 5 0 000-10z' fill='%231a1a1a'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body>
<a class="skip" href="#news">跳到资讯</a>
<header class="topbar"><a class="brand" href="./" aria-label="设计日报首页"><span class="brand-mark">日<span>↗</span></span><span>设计日报<span class="brand-cn">每日设计资讯</span></span></a><nav aria-label="主导航"><button class="top-link active" id="todayButton">每日精选</button><button class="top-link" id="archiveButton">往期日报</button><button class="top-link" id="aboutButton">关于日报 <span>↗</span></button></nav><button class="delivery" id="deliveryButton"><span class="delivery-icon">◷</span> 每日简报 <span class="delivery-time">09:00</span></button></header>
<main id="listingPage">
<section class="masthead" aria-labelledby="site-title"><div><div class="eyebrow">独立视角 · 每日设计精选</div><h1 id="site-title">设计，<span>每天发生。</span><i aria-hidden="true">✳</i></h1><p>从屏幕到日常物件，保持对好设计的好奇。</p></div><div class="issue-number"><span>今天的设计切片</span><strong id="issueMonth">—</strong><span id="issueYear">设计日报</span></div></section>
<section class="edition-bar" aria-label="日期与排序"><div class="edition-date"><span class="edition-label">本期日报</span><button id="previousDay" class="arrow-button" aria-label="上一期">‹</button><label class="date-wrap"><input type="date" id="datePicker" aria-label="选择日报日期"></label><button id="nextDay" class="arrow-button" aria-label="下一期">›</button><span id="weekday" class="weekday"></span></div><div class="edition-meta"><span id="articleCount">正在读取资讯</span><span class="separator">/</span><div class="sort-switch" role="group" aria-label="资讯排序"><button id="sortHot" class="selected" aria-pressed="true">按热度</button><button id="sortNew" aria-pressed="false">按时间</button></div></div></section>
<div class="category-bar" id="categories" role="group" aria-label="按设计领域筛选"></div>
<section id="news" tabindex="-1" aria-live="polite"><div class="loading-state">正在展开这一期设计日报…</div></section>
<div class="more-wrap"><button id="moreButton" hidden>继续阅读 <span>↓</span></button></div>
<section class="daily-note"><span class="note-symbol" aria-hidden="true">↗</span><div><span class="eyebrow">每天，为好奇心留一点时间。</span><h2>每天一点，打开设计的视野。</h2><p id="scheduleNote">每日简报计划：北京时间 09:00。</p></div><button id="sourcesButton">查看资讯来源 <span>↗</span></button></section>
</main>
<main id="articlePage" hidden></main>
<footer><a class="footer-brand" href="./">设计日报</a><span>设计日报 · 保持好奇</span><div><span id="updatedAt">尚未更新</span><button id="rankingButton">热度如何计算？</button></div></footer>
<dialog id="infoDialog" aria-labelledby="dialogTitle"><div class="dialog-heading"><span class="eyebrow">设计日报 · 阅读笔记</span><button id="closeDialog" aria-label="关闭对话框">×</button></div><h2 id="dialogTitle"></h2><div id="dialogBody"></div></dialog>
</body></html>
