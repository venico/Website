<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>象素之间 · 历史归档</title><style>body{max-width:900px;margin:40px auto;padding:0 20px;font:18px/1.8 system-ui;color:#222}article{padding:30px 0;border-bottom:1px solid #ddd}img{max-width:100%;height:auto;display:block;margin:24px auto}a{color:inherit}button{padding:8px;margin:8px}small{color:#777}</style><h1>象素之间 · 历史归档</h1><p>可下载整个目录，在本地打开本页面阅读；视频和原文链接需要联网。</p><nav id="issues"></nav><main id="body"></main><script src="data.js"></script><script>const d=window.ARCHIVE_DATA;function el(t,s,p){let n=document.createElement(t);n.textContent=s||'';if(p)p.append(n);return n}function show(i){body.replaceChildren();el('h2',i.date,body);for(let id of i.articleIds){let a=d.articles.find(a=>a.id===id);if(!a)continue;let box=el('article','',body);el('h2',a.titleZh,box);el('small',a.category+' · '+a.date+' · '+(d.sourceLabels[a.source]||a.source),box);el('p',a.summaryZh,box);for(let s of a.reading.sections){el('h3',s.heading,box);for(let p of s.paragraphs)el('p',p,box)}let seen=new Set;for(let u of [a.image,...a.images.map(i=>i.url)]){if(!u||seen.has(u))continue;seen.add(u);let im=document.createElement('img');im.src=u;im.alt=a.titleZh;im.loading='lazy';box.append(im)}let link=el('a','阅读原文',box);link.href=a.url;if(a.video){let v=el('p','',box),l=el('a','观看来源视频',v);l.href=a.video.url||a.video.src}}}for(let i of d.issues){let b=el('button',i.date,issues);b.onclick=()=>show(i)}if(d.issues.length)show(d.issues[0]);</script></html>
